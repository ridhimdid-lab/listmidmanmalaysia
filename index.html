<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Midman List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#060a12;
    color:#fff;
    min-height:100vh;
}

/* NAVBAR */
.navbar{
    height:72px;
    border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(6,10,18,.85);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#1683ff;
}

/* HERO */
.hero{
    max-width:1100px;
    margin:auto;
    padding:85px 20px 45px;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:999px;
    background:rgba(22,131,255,.1);
    border:1px solid rgba(22,131,255,.25);
    color:#62aaff;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(40px,7vw,68px);
    line-height:1;
    letter-spacing:-3px;
}

.hero h1 span{
    color:#1683ff;
}

.hero p{
    margin:18px auto 0;
    max-width:520px;
    color:#7e8a9e;
    font-size:15px;
    line-height:1.7;
}

/* SEARCH */
.search-box{
    max-width:600px;
    margin:0 auto 45px;
    padding:0 20px;
}

.search{
    width:100%;
    height:52px;
    background:#0c121e;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    color:#fff;
    padding:0 18px;
    outline:none;
    font-size:14px;
    transition:.2s;
}

.search:focus{
    border-color:#1683ff;
    box-shadow:0 0 0 3px rgba(22,131,255,.08);
}

/* GRID */
.container{
    max-width:1100px;
    margin:auto;
    padding:0 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
    gap:18px;
}

/* CARD */
.card{
    background:linear-gradient(
        145deg,
        rgba(17,26,41,.95),
        rgba(9,14,24,.98)
    );
    border:1px solid rgba(255,255,255,.07);
    border-radius:20px;
    padding:25px;
    position:relative;
    overflow:hidden;
    transition:.25s ease;
}

.card::before{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:#1683ff;
    filter:blur(70px);
    opacity:.08;
    top:-50px;
    right:-40px;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(22,131,255,.35);
    box-shadow:0 18px 45px rgba(0,0,0,.35);
}

.avatar{
    width:78px;
    height:78px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid #1683ff;
    background:#101827;
}

/* NAME */
.name-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:17px;
}

.name{
    font-size:19px;
    font-weight:800;
}

.tick{
    width:19px;
    height:19px;
    border-radius:50%;
    background:#1683ff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    box-shadow:0 0 12px rgba(22,131,255,.4);
}

/* ROLE */
.role{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:7px;
    background:rgba(22,131,255,.08);
    border:1px solid rgba(22,131,255,.18);
    color:#61aaff;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
}

/* WHATSAPP */
.whatsapp{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    margin-top:20px;
    height:44px;
    border-radius:11px;
    background:#1683ff;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    transition:.2s;
}

.whatsapp:hover{
    background:#0871df;
    transform:translateY(-1px);
}

/* EMPTY */
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#667286;
}

/* FOOTER */
footer{
    border-top:1px solid rgba(255,255,255,.06);
    padding:25px;
    text-align:center;
    color:#505c6e;
    font-size:12px;
}

/* MOBILE */
@media(max-width:600px){

    .navbar{
        height:64px;
    }

    .hero{
        padding:65px 20px 35px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:22px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        MID<span>MAN</span>
    </div>
</nav>


<!-- HERO -->
<section class="hero">

    <div class="badge">
        VERIFIED MIDMAN DIRECTORY
    </div>

    <h1>
        Find Your <span>Midman</span>
    </h1>

    <p>
        Choose a verified midman for your transaction.
        Contact them directly through WhatsApp.
    </p>

</section>


<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search midman..."
        autocomplete="off"
    >

</div>


<!-- PROFILES -->
<main class="container">

    <div
        class="grid"
        id="midmanGrid"
    ></div>

</main>


<footer>
    © 2026 Midman Directory
</footer>


<script>

/*
==================================================
MIDMAN DATA
==================================================

Tambah midman baru dekat bawah.

Format:

{
    name: "Nama",
    image: "URL GAMBAR",
    whatsapp: "60123456789",
    verified: true
}

verified:
true  = blue tick
false = tiada blue tick
*/

const midmen = [

    {
        name: "Luffy",
        image: "https://ibb.co/G45VxjSD",
        whatsapp: "60166263378",
        verified: true
    },

    {
        name: "Rexzz",
        image: "https://ui-avatars.com/api/?name=Rexzz&background=101827&color=ffffff&size=300",
        whatsapp: "6019876481",
        verified: true
    }

];


/*
==================================================
DISPLAY PROFILES
==================================================
*/

function displayMidmen(list){

    const grid =
        document.getElementById("midmanGrid");

    grid.innerHTML = "";

    if(list.length === 0){

        grid.innerHTML = `
            <div class="empty">
                No midman found.
            </div>
        `;

        return;
    }


    list.forEach(midman => {

        const card =
            document.createElement("div");

        card.className = "card";


        const tick =
            midman.verified
            ? `<span class="tick">✓</span>`
            : "";


        const whatsapp =
            String(midman.whatsapp)
            .replace(/\D/g,"");


        card.innerHTML = `

            <img
                class="avatar"
                src="${escapeHTML(midman.image)}"
                alt="${escapeHTML(midman.name)}"
            >

            <div class="name-row">

                <div class="name">
                    ${escapeHTML(midman.name)}
                </div>

                ${tick}

            </div>


            <div class="role">
                MIDMAN
            </div>


            <a
                class="whatsapp"
                href="https://wa.me/${whatsapp}"
                target="_blank"
                rel="noopener noreferrer"
            >
                WhatsApp
            </a>

        `;


        grid.appendChild(card);

    });

}


/*
==================================================
SEARCH
==================================================
*/

document
    .getElementById("search")
    .addEventListener("input", function(){

        const keyword =
            this.value
            .toLowerCase()
            .trim();


        const filtered =
            midmen.filter(midman =>
                midman.name
                .toLowerCase()
                .includes(keyword)
            );


        displayMidmen(filtered);

    });


/*
==================================================
SECURITY / HTML ESCAPE
==================================================
*/

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/*
==================================================
START
==================================================
*/

displayMidmen(midmen);

</script>

</body>
</html>
